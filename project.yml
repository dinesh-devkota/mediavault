name: CineVault
options:
  bundleIdPrefix: com.dineshdevkota
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 1.5.0
    CURRENT_PROJECT_VERSION: 7
packages:
  VLCKit:
    url: https://github.com/videolan/vlckit
    revision: 7f98c70f9f0c11fbdf828220890bd6280361ae99
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2
    from: 3.0.0
  CineVaultCore:
    path: Packages/CineVaultCore
targets:
  CineVault:
    type: application
    platform: tvOS
    sources:
      - path: CineVault
      - path: docs/PRIVACY.md
        buildPhase: resources
    dependencies:
      - package: CineVaultCore
      - package: VLCKit
      # AMSMB2 is LGPL (libsmb2); its product is declared .dynamic, so it is
      # embedded as a separate, replaceable framework.
      - package: AMSMB2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dineshdevkota.cinevault
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        MEDIA_VAULT_DRIVE_COMPANION_URL: ""
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: CineVault/Info.plist
      properties:
        CFBundleDisplayName: MediaVault
        MediaVaultDriveCompanionURL: "$(MEDIA_VAULT_DRIVE_COMPANION_URL)"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities: [arm64]
        NSLocalNetworkUsageDescription: MediaVault connects to your NAS and media servers on the local network to browse and play your media.
        NSBonjourServices: ["_smb._tcp"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsForMedia: true
  CineVaultTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: CineVaultTests
    dependencies:
      - target: CineVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CineVault:
    build:
      targets:
        CineVault: all
        CineVaultTests: [test]
    test:
      targets:
        - CineVaultTests
