name: CineVaultPhone
options:
  bundleIdPrefix: com.dineshdevkota
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 1.5.0
    CURRENT_PROJECT_VERSION: 7
packages:
  VLCKit:
    url: https://github.com/videolan/vlckit
    revision: 7f98c70f9f0c11fbdf828220890bd6280361ae99
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2
    from: 3.0.0
  CineVaultCore:
    path: Packages/CineVaultCore
targets:
  CineVault:
    type: application
    platform: iOS
    sources:
      - path: CineVault
        excludes:
          - Assets.xcassets
          - Info.plist
      - path: CineVaultiOS/Assets.xcassets
    dependencies:
      - package: CineVaultCore
      - package: VLCKit
      # The LGPL SMB library remains an embedded dynamic framework.
      - package: AMSMB2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dineshdevkota.cinevault.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: CineVaultiOS/Info.plist
      properties:
        CFBundleDisplayName: MediaVault
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: MediaVault connects to your NAS on the local network to browse and play media.
        NSBonjourServices: ["_smb._tcp"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  CineVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CineVaultTests
    dependencies:
      - target: CineVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CineVaultiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CineVaultiOSUITests
    dependencies:
      - target: CineVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CineVaultPhone:
    build:
      targets:
        CineVault: all
        CineVaultTests: [test]
        CineVaultiOSUITests: [test]
    test:
      targets:
        - CineVaultTests
        - CineVaultiOSUITests
