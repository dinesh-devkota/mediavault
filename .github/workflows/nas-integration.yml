name: NAS integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ui_only:
        description: Run remote UI and Home collection regressions for a navigation change
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nas-integration-${{ github.ref }}
  # Keep the active simulator's evidence; newer commits replace only queued runs.
  cancel-in-progress: false

jobs:
  nas-integration:
    name: ${{ inputs.ui_only && 'Test Apple TV remote navigation' || 'Test SMB on Apple TV simulator' }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned Apple playback dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apple-packages
          key: apple-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yml', 'project.ios.yml') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m unittest discover -s scripts/tests -p test_xcresult_report.py
          brew install xcodegen
          command -v ffmpeg >/dev/null || brew install ffmpeg
          python -m pip install -r scripts/nas-test-requirements.txt
      - name: Generate project
        run: |
          python3 scripts/generate_app_icons.py
          xcodegen generate --spec project.simulator-tests.yml
      - name: Select a tvOS simulator
        id: simulator
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk appletvsimulator --show-sdk-version | tr '.' '-')
          DEVICE=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtime = "com.apple.CoreSimulator.SimRuntime.tvOS-" + sys.argv[1]
          devices = json.load(sys.stdin)["devices"].get(runtime, [])
          candidates = [d for d in devices if d.get("isAvailable") and d["name"].startswith("Apple TV")]
          if not candidates:
              sys.exit("No available Apple TV simulator for " + runtime)
          device = next((d for d in candidates if "4K" in d["name"] and "1080p" in d["name"]), candidates[0])
          print(device["udid"])
          ' "$SDK")
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Build simulator tests
        run: |
          set -o pipefail
          xcodebuild -project CineVault.xcodeproj -scheme CineVault \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/apple-packages" \
            -destination 'id=${{ steps.simulator.outputs.device }}' \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/cinevault-tests" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES build-for-testing 2>&1 | tee "$RUNNER_TEMP/tvos-build.log" | tail -n 160
      - name: Report compiler errors
        if: failure()
        run: grep -n -A 5 -B 2 'error:' "$RUNNER_TEMP/tvos-build.log" || true
      - name: Test against local SMB, WebDAV, Jellyfin, and Plex fixtures
        env:
          UI_ONLY: ${{ inputs.ui_only || false }}
        run: |
          set -euo pipefail
          DEVICE='${{ steps.simulator.outputs.device }}'
          python scripts/nas_fixture.py "$RUNNER_TEMP/nas-fixture" >"$RUNNER_TEMP/nas-fixture.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          bash scripts/start_webdav_fixture.sh "$RUNNER_TEMP/webdav-fixture"
          WEBDAV_PID=$(cat "$RUNNER_TEMP/webdav-fixture/server.pid")
          trap 'kill "$SERVER_PID" "$WEBDAV_PID" 2>/dev/null || true' EXIT
          bash scripts/start_jellyfin_tvos_fixture.sh "$RUNNER_TEMP/jellyfin-fixture"
          JELLYFIN_PID=$(cat "$RUNNER_TEMP/jellyfin-fixture/server.pid")
          trap 'kill "$SERVER_PID" "$WEBDAV_PID" "$JELLYFIN_PID" 2>/dev/null || true' EXIT
          bash scripts/start_plex_fixture.sh "$RUNNER_TEMP/plex-fixture"
          PLEX_PID=$(cat "$RUNNER_TEMP/plex-fixture/server.pid")
          trap 'kill "$SERVER_PID" "$WEBDAV_PID" "$JELLYFIN_PID" "$PLEX_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/nas-fixture.log" >&2
              exit 1
            fi
            if nc -z 127.0.0.1 1445; then break; fi
            sleep 1
          done
          if ! nc -z 127.0.0.1 1445; then
            echo "SMB fixture did not start." >&2
            cat "$RUNNER_TEMP/nas-fixture.log" >&2
            exit 1
          fi
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl keychain "$DEVICE" add-root-cert "$RUNNER_TEMP/jellyfin-fixture/fixture.cer"
          # Install the ephemeral fixture's trust anchor only on this simulator.
          xcrun simctl keychain "$DEVICE" add-root-cert "$RUNNER_TEMP/webdav-fixture/fixture.cer"
          xcrun simctl keychain "$DEVICE" add-root-cert "$RUNNER_TEMP/plex-fixture/fixture.cer"
          # Bash 3.2 treats an empty array as unset under nounset. Keep the full
          # invocation nonempty, then append the optional focused-test filters.
          TEST_ARGS=(-project CineVault.xcodeproj -scheme CineVault
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/apple-packages"
            -destination "id=$DEVICE" -configuration Debug
            -derivedDataPath "$RUNNER_TEMP/cinevault-tests"
            -resultBundlePath "$RUNNER_TEMP/nas-results.xcresult"
            -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES)
          if [[ "$UI_ONLY" == "true" ]]; then
            TEST_ARGS+=(-only-testing:CineVaultUITests -only-testing:CineVaultTests/HomeCollectionTests)
          fi
          xcodebuild "${TEST_ARGS[@]}" test-without-building 2>&1 | tee "$RUNNER_TEMP/tvos-tests.log" | tail -n 200
      - name: Report simulator test results
        if: always()
        env:
          UI_ONLY: ${{ inputs.ui_only || false }}
        run: |
          set -euo pipefail
          if [[ ! -d "$RUNNER_TEMP/nas-results.xcresult" ]]; then
            echo "::error::XCTest result bundle is missing; simulator tests did not complete."
            exit 1
          fi
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/nas-results.xcresult" > "$RUNNER_TEMP/nas-summary.json"
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/nas-results.xcresult" > "$RUNNER_TEMP/nas-tests.json"
          if [[ "$UI_ONLY" == "true" ]]; then
            python3 scripts/report_xcresult.py "$RUNNER_TEMP/nas-summary.json"
          else
            python3 scripts/report_xcresult.py "$RUNNER_TEMP/nas-summary.json" --require-suite "$RUNNER_TEMP/nas-tests.json" PlexFixtureTests
          fi
          python3 - "$RUNNER_TEMP/nas-tests.json" <<'PY'
          import json, os, sys
          def passed(nodes):
              for node in nodes:
                  if node.get("result") == "Passed":
                      yield node.get("name", "").removesuffix("()")
                  yield from passed(node.get("children", []))
          with open(sys.argv[1]) as source:
              tests = set(passed(json.load(source)["testNodes"]))
          required = {"testCreateEditCollectionAndChooseAlternateVersion",
                      "testMKVRemotePlaybackSeekingSubtitlesAndAudioKeepSession"}
          if os.environ["UI_ONLY"] != "true":
              required |= {"testCommonContainersDecodeAndSeekOverGuardedSMB",
                           "testLocalSidecarsArtworkVersionsAndFranchiseWithoutOnlineKey"}
          missing = sorted(required - tests)
          if missing:
              sys.exit("Required Apple TV library/playback cases did not pass: " + ", ".join(missing))
          print("Required Apple TV library/playback cases passed.")
          PY
      - name: Export remote test screenshots
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/nas-results.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/nas-results.xcresult" \
              --output-path "$RUNNER_TEMP/remote-test-screenshots"
          fi
      - name: Upload remote test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinevault-remote-test-screenshots
          path: ${{ runner.temp }}/remote-test-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nas-integration-diagnostics
          path: |
            ${{ runner.temp }}/nas-fixture.log
            ${{ runner.temp }}/tvos-build.log
            ${{ runner.temp }}/tvos-tests.log
            ${{ runner.temp }}/jellyfin-fixture/server.log
            ${{ runner.temp }}/webdav-fixture/server.log
            ${{ runner.temp }}/plex-fixture/server.log
            ${{ runner.temp }}/nas-results.xcresult
          if-no-files-found: warn
          retention-days: 7
