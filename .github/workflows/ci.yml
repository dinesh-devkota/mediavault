name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core package tests
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Packages/CineVaultCore
        run: swift test
      - name: Test commercial build helpers
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_commercial_*.py'
          ruby -c fastlane/Fastfile

  build:
    name: Build tvOS app (unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          python3 scripts/generate_app_icons.py
          xcodegen generate
      - name: Build
        run: |
          set -euo pipefail
          SDK_VERSION=$(xcrun --sdk appletvos --show-sdk-version)
          if [[ "${SDK_VERSION%%.*}" -lt 26 ]]; then
            echo "App Store builds require tvOS SDK 26 or newer. Found $SDK_VERSION." >&2
            exit 1
          fi
          xcodebuild -version
          xcodebuild -project CineVault.xcodeproj -scheme CineVault \
            -destination 'generic/platform=tvOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/cinevault-release" \
            CODE_SIGNING_ALLOWED=NO build | tail -n 200
      - name: Verify privacy resources in the release app
        run: |
          APP="$RUNNER_TEMP/cinevault-release/Build/Products/Release-appletvos/CineVault.app"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          cmp docs/PRIVACY.md "$APP/PRIVACY.md"
