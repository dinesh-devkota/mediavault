name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core package tests
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Packages/CineVaultCore
        run: swift test
      - name: Test commercial build helpers
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_commercial_*.py'
          ruby -c fastlane/Fastfile

  build:
    name: Build tvOS app (unsigned)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned Apple playback dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apple-packages
          key: apple-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yml', 'project.ios.yml') }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          python3 scripts/generate_app_icons.py
          xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project CineVault.xcodeproj -scheme CineVault \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/apple-packages" \
            -destination 'generic/platform=tvOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO build | tail -n 200
