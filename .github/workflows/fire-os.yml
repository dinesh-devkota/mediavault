name: Fire OS compatibility

on:
  pull_request:
    paths: ["android/**", "scripts/test_fire_os_runtime.sh", "scripts/nas_fixture.py", "scripts/media_library_fixture.py", "scripts/start_plex_fixture.sh", "scripts/plex_fixture.py", ".github/workflows/fire-os.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fire-os-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  legacy-runtime:
    name: Fire OS compatibility on Android API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [22, 25, 28]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          test -r /dev/kvm && test -w /dev/kvm
      - name: Start isolated NAS fixture
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install -r scripts/nas-test-requirements.txt
          python scripts/nas_fixture.py "$RUNNER_TEMP/fire-nas" >"$RUNNER_TEMP/fire-nas.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/fire-nas.pid"
          python - <<'PY'
          import os, socket, time
          from pathlib import Path
          for attempt in range(40):
              try:
                  with socket.create_connection(("127.0.0.1", 1445), timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              print((Path(os.environ["RUNNER_TEMP"]) / "fire-nas.log").read_text())
              raise SystemExit("Synthetic NAS fixture did not start")
          PY
      - name: Start isolated Plex fixture
        run: bash scripts/start_plex_fixture.sh "$RUNNER_TEMP/fire-plex" android
      - name: Verify secure storage, remote playback, Plex, OneDrive and library imports
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/test_fire_os_runtime.sh
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fire-os-api-${{ matrix.api }}
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
            android/app/build/fire-os-evidence/
            ${{ runner.temp }}/fire-nas.log
            ${{ runner.temp }}/fire-plex/server.log
          if-no-files-found: warn
      - name: Stop isolated NAS and Plex fixtures
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/fire-nas.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/fire-nas.pid")" 2>/dev/null || true
          fi
          if [[ -f "$RUNNER_TEMP/fire-plex/server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/fire-plex/server.pid")" 2>/dev/null || true
          fi
