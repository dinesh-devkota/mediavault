name: Android phone

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-phone.yml"
      - "scripts/test_android_phone.sh"
      - "scripts/nas_fixture.py"
      - "scripts/nas-test-requirements.txt"
      - "scripts/start_plex_fixture.sh"
      - "scripts/plex_fixture.py"
      - "CineVaultTests/Fixtures/**"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-phone.yml"
      - "scripts/test_android_phone.sh"
      - "scripts/nas_fixture.py"
      - "scripts/nas-test-requirements.txt"
      - "scripts/start_plex_fixture.sh"
      - "scripts/plex_fixture.py"
      - "CineVaultTests/Fixtures/**"

permissions:
  contents: read

concurrency:
  group: android-phone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone-runtime:
    name: Android phone touch setup and playback
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          test -r /dev/kvm && test -w /dev/kvm
      - name: Start synthetic SMB fixture
        run: |
          python -m pip install -r scripts/nas-test-requirements.txt
          python scripts/nas_fixture.py "$RUNNER_TEMP/phone-nas" >"$RUNNER_TEMP/phone-nas.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/phone-nas.pid"
          python - <<'PY'
          import socket, time
          for attempt in range(30):
              try:
                  with socket.create_connection(("127.0.0.1", 1445), timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("SMB fixture did not start")
          PY
      - name: Start synthetic Plex fixture
        run: bash scripts/start_plex_fixture.sh "$RUNNER_TEMP/phone-plex" android
      - name: Exercise the phone launcher, setup and player
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/test_android_phone.sh
      - name: Upload phone runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-phone-runtime
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
            ${{ runner.temp }}/phone-plex/server.log
          if-no-files-found: warn
      - name: Stop synthetic SMB and Plex fixtures
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/phone-nas.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/phone-nas.pid")" 2>/dev/null || true
          fi
          if [[ -f "$RUNNER_TEMP/phone-plex/server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/phone-plex/server.pid")" 2>/dev/null || true
          fi
